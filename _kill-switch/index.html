<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="cache-control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <title>Sveska — moving you to the new home</title>
    <link rel="canonical" href="https://sveska.pages.dev/" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0c0c0e;
        color: #f4efe6;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        gap: 16px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
      }
      p {
        margin: 0;
        color: #b8b2a6;
        font-size: 14px;
        line-height: 1.6;
        max-width: 480px;
      }
      a {
        color: #f2b544;
        font-weight: 700;
        text-decoration: none;
      }
      .dot {
        color: #f2b544;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Sveska<span class="dot">.</span> moved to a new home</h1>
      <p>
        Redirecting to <a href="https://sveska.pages.dev/">sveska.pages.dev</a> and clearing the
        cached old version. If this page doesn't move on its own in a few seconds, tap the link.
      </p>
    </div>

    <script>
      // Kill-switch bootstrapper, intended for the legacy sveska.studio
      // origin only. Order of operations matters:
      //   1. Register the new SW (which immediately self-destructs on activate
      //      and clears every cache).
      //   2. Best-effort unregister any old SWs directly from this page too,
      //      in case the new SW's activate handler hasn't run yet.
      //   3. Hop to the canonical origin, preserving the URL path so deep
      //      links survive.
      (async function () {
        const dest =
          'https://sveska.pages.dev' + location.pathname + location.search + location.hash;

        try {
          if ('serviceWorker' in navigator) {
            // Register the suicide SW (no-op if already registered).
            try {
              await navigator.serviceWorker.register('/sw.js', { scope: '/' });
            } catch (e) {
              /* swallowed */
            }
            // Also clean up directly in case the SW path is slow on this device.
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
            } catch (e) {
              /* swallowed */
            }
          }
          if ('caches' in window) {
            try {
              const names = await caches.keys();
              await Promise.all(names.map((n) => caches.delete(n)));
            } catch (e) {
              /* swallowed */
            }
          }
        } finally {
          // location.replace so the kill page never lands in browser history.
          location.replace(dest);
        }
      })();

      // Hard ceiling: if any of the above hangs (rare), force the redirect
      // after 1.5s so the user is never stuck on this page.
      setTimeout(function () {
        location.replace(
          'https://sveska.pages.dev' + location.pathname + location.search + location.hash,
        );
      }, 1500);
    </script>
  </body>
</html>
