# Static-host config. Cloudflare Pages equivalent lives in _redirects + _headers if we migrate.
# SPA fallback so React Router controls all routes (including POST /share-target).

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Canonical redirects — sveska.studio is the single public URL.
# Order matters: canonical-forcing redirects run BEFORE the SPA fallback.
#
# Why .netlify.app is deliberately NOT force-redirected: that's our
# always-available fallback. If sveska.studio's DNS breaks (it has — TLD
# delegation flipped to a parking NS once already), we lose access to the
# app entirely behind a forced redirect. .netlify.app stays a live backup
# that mirrors the latest deploy. SEO is handled via <link rel="canonical">
# in the app shell — we don't need a server-side 301 for that to work.
# (Same reasoning applies to the .kineticgain.com aliases: keep them
# reachable as warm spares.)

[[redirects]]
  from = "https://www.sveska.studio/*"
  to = "https://sveska.studio/:splat"
  status = 301
  force = true

# SPA fallback — every unmatched path returns index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. Mirrors the CSP meta in index.html; meta is the runtime authority,
# this is belt + suspenders for hosts that strip the meta tag.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # When the AI proxy lands at M4, append `https://api.sveska.studio` to connect-src.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'"
