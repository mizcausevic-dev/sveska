<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="'Bricolage Grotesque','Segoe UI',system-ui,sans-serif" role="img" aria-label="Sveska editor with split Markdown preview, notes rail, and AI side pane">
  <defs>
    <style>
      .bg{fill:#0c0c0e}
      .surf{fill:#161619}
      .raised{fill:#1d1d22}
      .border{stroke:#2a2a30;stroke-width:1;fill:none}
      .border-soft{stroke:#222228;stroke-width:1;fill:none}
      .accent{fill:#f2b544}
      .accent-soft{fill:#3a2e16}
      .ok{fill:#7ad29c}
      .ai{fill:#4fd6c4}
      .danger{fill:#e07a7a}
      .t{fill:#f4efe6}
      .td{fill:#b8b2a6}
      .h{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;fill:#f4efe6}
      .mono{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#b8b2a6}
      .body{font-family:'Inter',ui-sans-serif,system-ui;fill:#f4efe6}
      .eyebrow{font-family:'JetBrains Mono',monospace;fill:#b8b2a6;font-size:11px;letter-spacing:0.12em;text-transform:uppercase}
    </style>
  </defs>

  <!-- canvas bg -->
  <rect class="bg" width="1400" height="700"/>

  <!-- hero left column ------------------------------------------------ -->
  <g transform="translate(56,72)">
    <text class="eyebrow" x="0" y="0">● live · v0.4.0-m4 · sarajevo night</text>
    <text class="h" x="0" y="48" font-size="56">The folded page</text>
    <text class="h" x="0" y="116" font-size="56" fill="#f2b544">does not need permission.</text>
    <text class="body" x="0" y="172" font-size="17" opacity="0.85">A studio-grade, local-first notepad PWA. Your notes live in</text>
    <text class="body" x="0" y="196" font-size="17" opacity="0.85">your browser — not on someone else's server — and they outlive</text>
    <text class="body" x="0" y="220" font-size="17" opacity="0.85">the network. No account, no telemetry, no slop.</text>

    <!-- stat tiles -->
    <g transform="translate(0,272)">
      <rect class="surf" x="0" y="0" width="130" height="78" rx="10"/>
      <rect class="border" x="0" y="0" width="130" height="78" rx="10"/>
      <text class="h" x="14" y="38" font-size="22">&lt;180 KB</text>
      <text class="mono" x="14" y="58" font-size="10">main bundle, gzip</text>

      <rect class="surf" x="142" y="0" width="130" height="78" rx="10"/>
      <rect class="border" x="142" y="0" width="130" height="78" rx="10"/>
      <text class="h" x="156" y="38" font-size="22">217</text>
      <text class="mono" x="156" y="58" font-size="10">unit tests, 0 fails</text>

      <rect class="surf" x="284" y="0" width="130" height="78" rx="10"/>
      <rect class="border" x="284" y="0" width="130" height="78" rx="10"/>
      <text class="h" x="298" y="38" font-size="22">0 keys</text>
      <text class="mono" x="298" y="58" font-size="10">in browser, ever</text>

      <rect class="surf" x="426" y="0" width="130" height="78" rx="10"/>
      <rect class="border" x="426" y="0" width="130" height="78" rx="10"/>
      <text class="h" x="440" y="38" font-size="22">5 ✓</text>
      <text class="mono" x="440" y="58" font-size="10">milestones shipped</text>
    </g>

    <!-- ribbon: kbd hints -->
    <g transform="translate(0,400)" font-family="'JetBrains Mono',monospace" font-size="11">
      <rect class="raised" x="0" y="0" width="58" height="22" rx="5"/><text class="td" x="14" y="15">Ctrl+K</text>
      <text class="td" x="64" y="15" opacity="0.6">palette</text>
      <rect class="raised" x="130" y="0" width="58" height="22" rx="5"/><text class="td" x="144" y="15">Ctrl+P</text>
      <text class="td" x="194" y="15" opacity="0.6">search</text>
      <rect class="raised" x="260" y="0" width="58" height="22" rx="5"/><text class="td" x="274" y="15">Ctrl+T</text>
      <text class="td" x="324" y="15" opacity="0.6">templates</text>
      <rect class="raised" x="402" y="0" width="58" height="22" rx="5"/><text class="td" x="416" y="15">Ctrl+F</text>
      <text class="td" x="466" y="15" opacity="0.6">find</text>
    </g>
  </g>

  <!-- product mock window ---------------------------------------------- -->
  <g transform="translate(720,80)">
    <!-- window shell -->
    <rect class="surf" x="0" y="0" width="624" height="560" rx="12"/>
    <rect class="border" x="0" y="0" width="624" height="560" rx="12"/>

    <!-- chrome -->
    <rect class="raised" x="0" y="0" width="624" height="38" rx="12"/>
    <rect class="raised" x="0" y="22" width="624" height="16"/>
    <circle class="danger" cx="20" cy="19" r="5"/>
    <circle class="accent" cx="38" cy="19" r="5"/>
    <circle class="ok" cx="56" cy="19" r="5"/>
    <text class="mono" x="312" y="23" font-size="11" text-anchor="middle">sveska.studio · weekend.md</text>

    <!-- tab strip -->
    <g transform="translate(14,52)">
      <rect class="accent-soft" x="0" y="0" width="118" height="28" rx="6"/>
      <circle class="accent" cx="12" cy="14" r="3"/>
      <text class="t" x="22" y="18" font-size="11">weekend.md</text>
      <text class="td" x="100" y="18" font-size="11">×</text>
      <rect class="raised" x="126" y="0" width="86" height="28" rx="6"/>
      <text class="td" x="138" y="18" font-size="11">ideas.md</text>
      <text class="td" x="220" y="18" font-size="14">+</text>
    </g>

    <!-- tags bar -->
    <g transform="translate(14,92)">
      <rect class="raised" x="0" y="0" width="26" height="22" rx="5"/>
      <text class="accent" x="9" y="16" font-size="13">★</text>
      <rect fill="#3a2e16" stroke="#5a4628" x="34" y="0" width="58" height="22" rx="11"/>
      <text class="t" x="44" y="15" font-size="11" font-family="JetBrains Mono,monospace">#weekly</text>
      <rect fill="#3a2e16" stroke="#5a4628" x="98" y="0" width="44" height="22" rx="11"/>
      <text class="t" x="108" y="15" font-size="11" font-family="JetBrains Mono,monospace">#draft</text>
      <rect fill="#1a2418" stroke="#3a6044" x="540" y="0" width="36" height="22" rx="5"/>
      <text class="ok" x="548" y="15" font-size="10" font-family="JetBrains Mono,monospace">MD</text>
    </g>

    <!-- toolbar -->
    <g transform="translate(14,128)">
      <circle class="ok" cx="6" cy="12" r="4"/>
      <text class="mono" x="16" y="16" font-size="10">snapshot · last 14:02</text>
      <rect class="accent" x="160" y="2" width="78" height="20" rx="5"/>
      <text class="bg" x="170" y="16" font-size="10" font-weight="700" font-family="'JetBrains Mono',monospace">Save snapshot</text>
      <rect class="raised" x="244" y="2" width="58" height="20" rx="5"/>
      <text class="td" x="252" y="16" font-size="10" font-family="'JetBrains Mono',monospace">History (3)</text>
      <rect class="raised" x="500" y="2" width="76" height="20" rx="5"/>
      <text class="td" x="510" y="16" font-size="10" font-family="'JetBrains Mono',monospace">.md  .pdf  ⌄</text>
    </g>

    <!-- split: textarea + preview -->
    <g transform="translate(14,160)">
      <rect class="bg" x="0" y="0" width="293" height="372" rx="8"/>
      <rect class="border-soft" x="0" y="0" width="293" height="372" rx="8"/>
      <g font-family="'JetBrains Mono',monospace" font-size="11">
        <text class="accent" x="14" y="24"># weekend.md</text>
        <text class="td" x="14" y="42" opacity="0.6">&lt;!-- snapshot 14:02 · 312 words --&gt;</text>
        <text class="t" x="14" y="68">The folded page does not need</text>
        <text class="t" x="14" y="84">permission to be written on.</text>
        <text class="t" x="14" y="100">Local-first means the app keeps</text>
        <text class="t" x="14" y="116">working when the network does not.</text>
        <text class="accent" x="14" y="144">## ship sveska v0.1</text>
        <text class="t" x="14" y="166">- [x] draft the studio post</text>
        <text class="t" x="14" y="182">- [x] ship snapshot diff view</text>
        <text class="ok" x="14" y="198">- [x] streaming AI proxy</text>
        <text class="td" x="14" y="214">- [ ] excalidraw canvas (M5)</text>
        <text class="accent" x="14" y="244">## the brief</text>
        <text class="t" x="14" y="266">a notebook that outlives the</text>
        <text class="t" x="14" y="282">network |</text>
      </g>
      <!-- caret blink -->
      <rect class="accent" x="78" y="274" width="2" height="14"/>

      <!-- preview pane -->
      <rect class="surf" x="307" y="0" width="293" height="372" rx="8"/>
      <rect class="border-soft" x="307" y="0" width="293" height="372" rx="8"/>
      <g transform="translate(321,18)">
        <text class="h" x="0" y="22" font-size="22">weekend.md</text>
        <text class="td" x="0" y="44" font-size="10" font-family="'JetBrains Mono',monospace" opacity="0.6">snapshot 14:02 · 312 words</text>
        <text class="t" x="0" y="72" font-size="12">The folded page does not need</text>
        <text class="t" x="0" y="88" font-size="12">permission to be written on.</text>
        <text class="t" x="0" y="104" font-size="12">Local-first means the app keeps</text>
        <text class="t" x="0" y="120" font-size="12">working when the network does not.</text>

        <text class="h" x="0" y="156" font-size="16">ship sveska v0.1</text>
        <g font-size="12" font-family="ui-sans-serif">
          <rect class="ok" x="0" y="170" width="12" height="12" rx="2"/>
          <text class="bg" x="3" y="180" font-size="11" font-weight="700">✓</text>
          <text class="td" x="20" y="180" text-decoration="line-through">draft the studio post</text>
          <rect class="ok" x="0" y="190" width="12" height="12" rx="2"/>
          <text class="bg" x="3" y="200" font-size="11" font-weight="700">✓</text>
          <text class="td" x="20" y="200" text-decoration="line-through">ship snapshot diff view</text>
          <rect class="ok" x="0" y="210" width="12" height="12" rx="2"/>
          <text class="bg" x="3" y="220" font-size="11" font-weight="700">✓</text>
          <text class="td" x="20" y="220" text-decoration="line-through">streaming AI proxy</text>
          <rect class="raised" x="0" y="230" width="12" height="12" rx="2"/>
          <rect class="border-soft" x="0" y="230" width="12" height="12" rx="2"/>
          <text class="t" x="20" y="240">excalidraw canvas (M5)</text>
        </g>

        <text class="h" x="0" y="282" font-size="16">the brief</text>
        <text class="t" x="0" y="306" font-size="12">a notebook that outlives the</text>
        <text class="t" x="0" y="322" font-size="12">network</text>
      </g>
    </g>

    <!-- status footer -->
    <g transform="translate(14,544)" font-size="10" font-family="'JetBrains Mono',monospace">
      <circle class="ok" cx="5" cy="-2" r="3"/>
      <text class="td" x="14" y="2">SAVED · 14:04:22</text>
      <text class="td" x="180" y="2">312 / 1000 words</text>
      <rect class="raised" x="278" y="-7" width="50" height="9" rx="4"/>
      <rect class="accent" x="278" y="-7" width="16" height="9" rx="4"/>
      <text class="td" x="346" y="2">⏱ 04:12 writing</text>
    </g>
  </g>

  <!-- accent ribbon footer ------------------------------------------- -->
  <g transform="translate(56,660)">
    <text class="eyebrow" x="0" y="0">sveska.studio · github.com/mizcausevic-dev/sveska · MIT</text>
  </g>
</svg>
