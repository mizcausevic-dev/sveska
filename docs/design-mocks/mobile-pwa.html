<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sveska — Mobile PWA</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="brand/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f0eee9;
      }
      body {
        font-family: 'Satoshi', system-ui, sans-serif;
      }
    </style>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="design-canvas.jsx"></script>
    <script type="text/babel" src="ios-frame.jsx"></script>
    <script type="text/babel" src="android-frame.jsx"></script>
    <script type="text/babel" src="mobile.jsx"></script>
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <DesignCanvas projectTitle="Sveska — Mobile PWA" initialZoom={0.62}>
          <DCSection
            id="ios"
            title="iOS · 402 × 874"
            subtitle="Sveska as a PWA on iPhone — full-bleed dark, the same tokens, with the editor surface restrained to the writing essentials and the AI command tucked behind one chip."
          >
            <DCArtboard id="ios-list" label="① Notes list · home" width={460} height={920}>
              <div
                style={{
                  padding: 24,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  height: '100%',
                }}
              >
                <IOSNotesList />
              </div>
            </DCArtboard>

            <DCArtboard id="ios-editor" label="② Editor · keyboard up" width={460} height={920}>
              <div
                style={{
                  padding: 24,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  height: '100%',
                }}
              >
                <IOSEditor />
              </div>
            </DCArtboard>

            <DCArtboard
              id="ios-install"
              label="③ Add to Home Screen · install"
              width={460}
              height={920}
            >
              <div
                style={{
                  padding: 24,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  height: '100%',
                }}
              >
                <IOSInstall />
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="android"
            title="Android · 412 × 892"
            subtitle="Material chrome, Sveska content. Web Share Target captures Chrome shares — the cyan banner is what the user sees the moment they tap 'Share to Sveska'."
          >
            <DCArtboard
              id="android-share"
              label="④ Notes list · Web Share Target incoming"
              width={480}
              height={940}
            >
              <div
                style={{
                  padding: 24,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  height: '100%',
                }}
              >
                <AndroidNotes />
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>,
      );
    </script>
  </body>
</html>
