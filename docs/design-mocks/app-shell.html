<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sveska — App Shell</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="brand/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f0eee9;
      }
      body {
        font-family: 'Satoshi', system-ui, sans-serif;
      }
    </style>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="design-canvas.jsx"></script>
    <script type="text/babel" src="app-shell.jsx"></script>
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <DesignCanvas projectTitle="Sveska — App Shell" initialZoom={0.5}>
          <DCSection
            id="desktop"
            title="Desktop · 1440 × 900"
            subtitle="The full shell at PWA resolution — composes every system component into a single working frame. Dark default, light mirror, and focus mode."
          >
            <DCArtboard id="dark" label="Dark · default" width={1440} height={900}>
              <AppShell theme="dark" mode="default" />
            </DCArtboard>

            <DCArtboard id="light" label="Light · default" width={1440} height={900}>
              <AppShell theme="light" mode="default" />
            </DCArtboard>

            <DCArtboard id="focus-dark" label="Focus mode · Alt+F" width={1440} height={900}>
              <AppShell theme="dark" mode="focus" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>,
      );
    </script>
  </body>
</html>
