<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sveska — Multi-Note · Search · History</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="brand/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f0eee9;
      }
      body {
        font-family: 'Satoshi', system-ui, sans-serif;
      }
    </style>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="design-canvas.jsx"></script>
    <script type="text/babel" src="multinote-chrome.jsx"></script>
    <script type="text/babel" src="multinote-screens.jsx"></script>
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <DesignCanvas projectTitle="Sveska — Multi-Note · M2" initialZoom={0.42}>
          <DCSection
            id="multinote"
            title="Multi-note · M2.1 + M2.4"
            subtitle="The depth view — 5 tabs, favorites bar, quick-capture inbox, filters, tag chips, recents rail. A tag-filtered grid view at the same shell."
          >
            <DCArtboard
              id="overview"
              label="① Overview · 5 tabs · rich sidebar"
              width={1440}
              height={900}
            >
              <ScreenMultiNote />
            </DCArtboard>
            <DCArtboard id="tag" label="② Tag filter · reading · 4 notes" width={1440} height={900}>
              <ScreenTagFilter />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="search-history"
            title="Search & history · M2.2 + M2.5"
            subtitle="Fuzzy search ('1k notes, < 50 ms') and the version-history split-pane diff. Restore modal and crash-recovery sit alongside as the trust layer."
          >
            <DCArtboard
              id="search"
              label='③ Fuzzy search · "selim" · 8 in 6'
              width={1440}
              height={900}
            >
              <ScreenSearch />
            </DCArtboard>
            <DCArtboard
              id="diff"
              label="④ Version history · 13:48 ↔ 14:02"
              width={1440}
              height={900}
            >
              <ScreenVersionDiff />
            </DCArtboard>
            <DCArtboard
              id="restore"
              label="⑤ Session restore · open previous"
              width={1440}
              height={900}
            >
              <ScreenSessionRestore />
            </DCArtboard>
            <DCArtboard
              id="crash"
              label="⑥ Crash recovery · unsaved drafts"
              width={1440}
              height={900}
            >
              <ScreenSessionRestore crash />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>,
      );
    </script>
  </body>
</html>
