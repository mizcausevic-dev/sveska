<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sveska — Empty → First Snapshot · Motion</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="brand/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f0eee9;
      }
      body {
        font-family: 'Satoshi', system-ui, sans-serif;
      }
    </style>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="design-canvas.jsx"></script>
    <script type="text/babel" src="animations.jsx"></script>
    <script type="text/babel" src="firstnote-scene.jsx"></script>
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <DesignCanvas projectTitle="Sveska — First Note · Motion" initialZoom={0.42}>
          <DCSection
            id="motion"
            title="Motion · empty → first snapshot"
            subtitle="14-second loop. Six beats — empty notebook, the chord, editor materializes, typing, snapshot pending, saved. Click play or scrub the timeline; SPACE toggles, ←/→ step 0.1 s (Shift = 1 s)."
          >
            <DCArtboard
              id="scene"
              label="Live scrub · 1440 × 900 · 14 s loop"
              width={1440}
              height={944}
            >
              <Stage
                width={1440}
                height={900}
                duration={14}
                background="#0C0C0E"
                loop={true}
                autoplay={true}
                persistKey="sveska-firstnote"
              >
                <AnimatedScene />
              </Stage>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="keyframes"
            title="Keyframes · the six beats"
            subtitle="Static frames at signature moments — for the motion spec hand-off. Time-stamped against the loop above."
          >
            <DCArtboard id="kf1" label="01 · 1.5 s · empty notebook" width={640} height={400}>
              <Keyframe t={1.5} width={640} height={400} caption="t = 01.50 s" />
            </DCArtboard>
            <DCArtboard id="kf2" label="02 · 3.2 s · ⌘N chord" width={640} height={400}>
              <Keyframe t={3.2} width={640} height={400} caption="t = 03.20 s" />
            </DCArtboard>
            <DCArtboard id="kf3" label="03 · 4.6 s · editor materializes" width={640} height={400}>
              <Keyframe t={4.6} width={640} height={400} caption="t = 04.60 s" />
            </DCArtboard>
            <DCArtboard id="kf4" label="04 · 7.6 s · mid-typing" width={640} height={400}>
              <Keyframe t={7.6} width={640} height={400} caption="t = 07.60 s" />
            </DCArtboard>
            <DCArtboard
              id="kf5"
              label="05 · 10.3 s · snapshot pending · ⌘S"
              width={640}
              height={400}
            >
              <Keyframe t={10.3} width={640} height={400} caption="t = 10.30 s" />
            </DCArtboard>
            <DCArtboard id="kf6" label="06 · 12.5 s · saved · at rest" width={640} height={400}>
              <Keyframe t={12.5} width={640} height={400} caption="t = 12.50 s" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>,
      );
    </script>
  </body>
</html>
