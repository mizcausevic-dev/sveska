name: CI

# Pre-merge gate for the SPA. Deploys are handled by Cloudflare Pages' own
# git integration — every push to `main` triggers a Pages build that runs
# `pnpm install --frozen-lockfile && pnpm build` and ships the result.
# This workflow exists so PRs get a status check from the same gates
# (typecheck / lint / test) that the SPA's `pnpm build` runs internally,
# plus the unit-test suite which the deploy build does NOT run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Reads pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (runs key-leak + bundle-budget gates)
        run: pnpm build
